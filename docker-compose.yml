services:
  pharmasim:
    build: .
    image: mktech/pharmasim:latest
    container_name: pharmasim
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pharmasim_data:/app/.data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

volumes:
  pharmasim_data:
